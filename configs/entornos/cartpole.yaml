# Perfil activo de CartPole. Los tamaños del experimento se repiten aquí aunque
# coincidan con default.yaml, para que no cambien si cambia la base.
experimento:
  # Elección propia: el código original usa 7 (im_classic_pipeline.yaml, runs); 5 para
  # repartir el barrido en 5 procesos sin que compartan núcleo (presupuesto, regla 5/20).
  repeticiones: 5
datos:
  # Congelado el 2026-10-28, commit 2a9be76305d0ac83009261f3abf8de3a9718a189.
  demostraciones: data/demostraciones/cartpole/congelado
  experto: checkpoints/expertos/cartpole/congelado
  huella_partidas: 84dd2815e125ac677e764fef55e8cfb2ed1bddbf68b8c5e773b75bbb0f22fd73
  huella_experto: 4c5f7ad00efdbf97bba1b79d934b572df40ddee48d0f732b23a9d78ad4582195  # SHA-256 de modelo.zip
  artefacto_demostraciones: demostraciones-ce06866eff92  # Artefacto W&B congelado.
  artefacto_experto: experto-CartPole-v1-4c5f7ad00efd
demostraciones:
  partidas_train: 10  # Igual al subconjunto mayor.
  partidas_validacion: 5  # Elección propia; el paper separa 70/30 los pares.
  subconjuntos: [1, 4, 7, 10]  # Paper, figura 1; código original (dataset_num_trajs).
  frecuencia_pares: 10  # Código original de GAIL para CartPole (data_subsamp_freq).
entorno:
  id: CartPole-v1  # Gymnasium; v1 permite hasta 500 pasos por episodio.
# La sección trpo la usan el experto y GAIL. El paper da gamma, gae_lambda y
# los pares por iteración para GAIL; aplicarlos también al experto es elección propia.
trpo:
  capas_ocultas: [100, 100]  # Paper Ho y Ermon (2016), sección 6.
  activacion: tanh  # Paper Ho y Ermon (2016), sección 6.
  gamma: 0.995  # Paper Ho y Ermon (2016), apéndice B.
  gae_lambda: 0.97  # Paper Ho y Ermon (2016), apéndice B.
  target_kl: 0.01  # Código original de GAIL (max_kl).
  cg_damping: 0.1  # Código original de GAIL.
  pasos_por_iteracion: 5000  # Paper Ho y Ermon (2016), tabla 2.
  # Elección propia: 10 partidas a la vez de 500 pasos por iteración; mismo número de
  # pasos que con una, unas 2,7 veces más rápido (medido). Afecta también al experto.
  n_entornos: 10
  normalizar_observaciones: false  # Elección propia: en CartPole no hace falta.
  batch_size_valor: 250  # Divide los 5000 pasos de cada iteración.
experto:
  pasos_totales: 100000  # Presupuesto inicial elegido para el proyecto; falta medir.
  # Elección propia: máximo de CartPole-v1 (el umbral de Gymnasium es 475), como el
  # experto perfecto del paper (200 ± 0 en CartPole-v0, tabla 1).
  retorno_objetivo: 500
gail:
  # Elección propia por regla 5/20; el paper usa 300 (tabla 2) y el original, 301.
  iteraciones: 20
  evaluar_cada: 10  # Elección propia: validaciones en 10 y 20 iteraciones.
  episodios_evaluacion: 10  # Elección propia; la evaluación final usa 50.
  evaluacion_determinista: true  # Como evalúa el original las políticas aprendidas.
  # Código original de GAIL: −log(1 − D), porque las partidas terminan al fallar
  # (cuts_off_on_success: false en im_classic_pipeline.yaml).
  recompensa: menos_log_uno_menos_d
evaluacion:
  episodios: 50  # Protocolo común fijado por la rama evaluacion-checkpoints.
  semilla: 9000
  determinista: true  # Como evalúa el original las políticas aprendidas.
