# Perfil de Reacher (MuJoCo). Reacher no aparece en los pipelines del código original de
# GAIL: elección propia, los tamaños de sus entornos MuJoCo (im_pipeline.yaml), repetidos
# aquí para que no cambien si cambia la base. El paper da otros (tabla 2 y apéndice B:
# 200 iteraciones, subconjuntos de 4, 11 y 18 partidas y 7 políticas). Necesita
# gymnasium[mujoco].
experimento:
  repeticiones: 1  # Como los MuJoCo del código original (runs).
datos:
  # Congelado el 2026-11-01 en Linux (WSL2, Python 3.12.3, OMP_NUM_THREADS=1), commit
  # a6b8bdb2bbfce379554813c477bfaf33ef82e412. Sustituye al del commit 6ba7aae.
  demostraciones: data/demostraciones/reacher/congelado
  experto: checkpoints/expertos/reacher/congelado
  huella_partidas: b2f098f94c7962c2c758eaf57647349dd84fb8b85a497426238986c5a98f384f
  huella_experto: 44a588281ef50b159a9a15fcac2bbd369da987f15b84156c2c0500b10dccc74a  # SHA-256 de policy.pth en modelo.zip
  artefacto_demostraciones: demostraciones-1b16407e4fd8  # Artefacto W&B congelado.
  artefacto_experto: experto-Reacher-v5-a69d425ddb0f
demostraciones:
  # Igual al subconjunto mayor. El original graba 50 (full_dataset_num_trajs) y usa
  # hasta 25; aquí la validación va aparte, por trayectoria.
  partidas_train: 25
  partidas_validacion: 5  # Elección propia, como en CartPole; el paper separa 70/30 los pares.
  subconjuntos: [4, 11, 18, 25]  # Como los MuJoCo del original (dataset_num_trajs).
  frecuencia_pares: 20  # Como los MuJoCo del original (data_subsamp_freq).
entorno:
  id: Reacher-v5  # Gymnasium. 50 pasos por partida.
trpo:
  capas_ocultas: [100, 100]  # Paper Ho y Ermon (2016), sección 6.
  activacion: tanh  # Paper Ho y Ermon (2016), sección 6.
  gamma: 0.995  # Paper Ho y Ermon (2016), apéndice B.
  gae_lambda: 0.97  # Paper Ho y Ermon (2016), apéndice B.
  target_kl: 0.01  # Código original de GAIL (max_kl).
  cg_damping: 0.1  # Código original de GAIL.
  pasos_por_iteracion: 50000  # Como los MuJoCo del original (min_total_sa).
  # Elección propia, como en CartPole: 10 partidas a la vez, mismos pasos por iteración.
  n_entornos: 10
  normalizar_observaciones: true  # Como el original; en MuJoCo hace falta.
  batch_size_valor: 250  # Divide los 50 000 pasos de cada iteración.
experto:
  # 25 M pasos, el presupuesto de antes (500 iteraciones de 50 000, como los snapshots de
  # los expertos MuJoCo originales, iter0000500). Con iteraciones de 2048 no es múltiplo:
  # para en la primera que lo supera (12 208 iteraciones, 25 001 984 pasos).
  pasos_totales: 25000000
  # Cada 50 iteraciones, unos 100 000 pasos, como antes (2 iteraciones de 50 000).
  evaluar_cada: 50
  # Elección propia: por encima del experto del paper (tabla 1: −4,09) y del umbral de
  # Gymnasium (reward_threshold de Reacher-v5, −3,75).
  retorno_objetivo: -3.5
  # Hiperparámetros del experto (GAIL sigue con la sección trpo): los de TRPO de RL Zoo
  # para ReacherBulletEnv-v0 (hyperparams/trpo.yml; no tiene Reacher de MuJoCo) sin
  # normalizar la recompensa (RL Zoo la normaliza). Elegidos por el equipo en el ajuste
  # del 2026-10-31 (grupo W&B ajuste-experto-reacher).
  trpo:
    capas_ocultas: [256, 256]  # policy_kwargs: net_arch pi y vf [256, 256].
    activacion: relu  # policy_kwargs: activation_fn nn.ReLU.
    log_std_inicial: -1.0  # policy_kwargs: log_std_init -1.
    inicializacion_ortogonal: false  # policy_kwargs: ortho_init False.
    gamma: 0.99
    gae_lambda: 0.95
    target_kl: 0.01  # RL Zoo no lo fija: el valor por defecto de sb3-contrib.
    cg_damping: 0.1
    pasos_por_iteracion: 2048  # n_steps 1024 × n_envs 2.
    n_entornos: 2
    normalizar_observaciones: true
    pasos_gradiente_conjugado: 25  # cg_max_steps.
    pasos_valor: 20  # n_critic_updates.
    learning_rate_valor: 0.001  # learning_rate (el del crítico en sb3-contrib).
    batch_size_valor: 128  # batch_size.
gail:
  iteraciones: 500  # Como los MuJoCo del original (max_iter 501).
  evaluar_cada: 10  # Elección propia, como en CartPole.
  episodios_evaluacion: 10  # Elección propia; la evaluación final usa 50.
  evaluacion_determinista: true  # Como evalúa el original las políticas aprendidas.
  # Como los MuJoCo del original: −log(1 − D). Las partidas duran siempre 50 pasos:
  # no terminan al tener éxito (cuts_off_on_success: false en im_pipeline.yaml).
  recompensa: menos_log_uno_menos_d
evaluacion:
  episodios: 50  # Código original de GAIL (eval_num_trajs).
  semilla: 9000
  determinista: true  # Como evalúa el original las políticas aprendidas.
