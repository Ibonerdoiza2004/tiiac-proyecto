# Todos los hiperparametros viven aqui. Ninguno escrito a fuego en el codigo:
# es lo que permite reproducir un experimento sabiendo solo que config se uso.

experimento:
  nombre: baseline
  seed: 42
  # Repeticiones de BC y GAIL por cada subconjunto, con semillas de modelo
  # distintas (codigo original: runs 7 en los entornos clasicos, 1 en MuJoCo).
  repeticiones: 7

datos:
  raiz: data/
  subset: 0              # 0 = dataset completo; un entero positivo = N muestras
  batch_size: 64
  num_workers: 2

modelo:
  nombre: mi_modelo
  # ... los del paper. Cada valor deberia poder senyalarse en la ficha de replicacion.

entorno:
  id: null

# Tamanos del experimento. Valores de los entornos clasicos; cada perfil los
# repite o los cambia (HalfCheetah en el original: subconjuntos 4, 11, 18, 25).
demostraciones:
  # Partidas de train: BC y GAIL solo ven las de los subconjuntos.
  partidas_train: 10
  # Eleccion propia: partidas aparte para la parada temprana de BC (el paper
  # separa 70/30 los pares de cada subconjunto).
  partidas_validacion: 5
  # Subconjuntos anidados de train (paper, figura 1; dataset_num_trajs).
  subconjuntos: [1, 4, 7, 10]
  # Semilla base de la grabacion; de ella salen la de cada partida y la del
  # reparto en splits (semillas_independientes).
  semilla: 2000
  # El original graba con el experto estocastico (deterministic_expert: false
  # en im_classic_pipeline.yaml) y guarda todas las partidas, sin filtrarlas.
  determinista: false

bc:
  # Politica de BC del paper: 2 capas ocultas de 100 neuronas con tanh.
  capas_ocultas: [100, 100]
  activacion: tanh
  # Acciones continuas: log de la desviacion tipica inicial de la gaussiana
  # (eleccion propia; 0.0 es el valor por defecto de las politicas de SB3).
  log_std_inicial: 0.0
  # Normalizacion de observaciones con media y desviacion de train.
  # Componentes con desviacion <= epsilon solo se centran.
  normalizar_observaciones: true
  epsilon_normalizacion: 1.0e-6
  # Un par (estado, accion) de cada N pasos. Depende del entorno y se define
  # en configs/entornos/.
  frecuencia_pares: null
  # Adam con minibatches de 128 (paper) y learning rate 1e-3 (codigo original).
  # Las epocas maximas y la paciencia son eleccion propia: el original entrena
  # un numero fijo de iteraciones y se queda con el mejor snapshot.
  optimizador: adam
  batch_size: 128
  learning_rate: 0.001
  epocas_maximas: 500
  paciencia: 20

trpo:
  capas_ocultas: null
  activacion: null
  gamma: null
  gae_lambda: null
  target_kl: null
  cg_damping: null
  pasos_por_iteracion: null
  n_entornos: null
  # Normalizacion de observaciones con VecNormalize (sin normalizar la
  # recompensa). El original la usa; en CartPole sobra y en MuJoCo hace falta.
  normalizar_observaciones: false
  limite_normalizacion: 10.0       # recorte tras normalizar (valor de sb3)
  # Ventajas estandarizadas antes del paso de la politica, como el original.
  normalizar_ventajas: true
  # Paso de la politica (valores por defecto de sb3-contrib).
  pasos_gradiente_conjugado: 15
  busqueda_lineal_factor: 0.8
  busqueda_lineal_maximo: 10
  # Red de valor: el original da un paso de region de confianza; sb3 usa Adam
  # por minibatches (diferencia documentada). batch_size_valor debe dividir los
  # pasos de cada iteracion: 250 divide 5000.
  learning_rate_valor: 0.001
  pasos_valor: 10
  batch_size_valor: 250

experto:
  pasos_totales: null
  retorno_objetivo: null
  # Semilla base del experto; de ella salen las del modelo, los entornos de
  # entrenamiento y los de evaluacion (semillas_independientes).
  semilla: 1000
  # Cada cuantas iteraciones se evalua y con cuantos episodios. Se evalua la
  # politica estocastica, la que graba las demostraciones; se guarda la mejor
  # y se para al alcanzar retorno_objetivo (eleccion propia: el original usa
  # un snapshot fijo).
  evaluar_cada: 2
  episodios_evaluacion: 10
  evaluacion_determinista: false

gail:
  # Iteraciones de GAIL (paper, tabla 2: 300 en los entornos clasicos; el codigo
  # original usa max_iter 301). Puede bajar al medir la regla 5/20.
  iteraciones: 300
  discriminador:
    # Misma arquitectura que la politica (paper, seccion 6).
    capas_ocultas: [100, 100]
    activacion: tanh
    # Adam con learning rate 0.01, un paso por iteracion y peso 0.001 de la
    # entropia en la perdida (codigo original de GAIL).
    optimizador: adam
    learning_rate: 0.01
    pasos_adam: 1
    peso_entropia: 0.001
    # Eleccion propia: normalizacion fija con los pares expertos de train. El
    # original la actualiza en cada iteracion tambien con pares del agente.
    normalizar_entrada: true
    epsilon_normalizacion: 1.0e-6
  # menos_log_uno_menos_d o log_d. Depende del entorno: va en configs/entornos/.
  recompensa: null

evaluacion:
  episodios: 50  # Código original de GAIL; las semillas se comparten entre agentes.
  semilla: 9000  # Independiente de entrenamiento y demostraciones.
  determinista: true  # Como evalúa el original las políticas aprendidas.

entrenamiento:
  learning_rate: 0.001
  epochs: 20
  max_steps: 0              # 0 = sin límite; el smoke lo reduce
  optimizador: adam

wandb:
  proyecto: tiiac-2026
  entidad: ""           # vacío = entidad predeterminada de W&B
  modo: online          # 'disabled' en los tests
